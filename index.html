<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub de Fluxos — Sankhya</title>

<!-- Ionicons v2 (ícones) -->
<link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">

<style>
  :root{
    --sidebar:#19222a;
    --header:#09f;
    --text:#fff;
    --content-bg:#fefefe;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
    background:var(--content-bg);
    color:#111;
  }

  .app{min-height:100vh}

  /* Sidebar */
  .sidebar{
    position:fixed; inset:0 auto 0 0;
    width:17em; background:var(--sidebar); color:var(--text);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .sidebar header{
    background:var(--header);
    padding:12px 16px;
    font-weight:700;
  }

  /* Barra de pesquisa */
  .sidebar-search{
    padding:8px 12px;
    background:#111a22;
    border-bottom:1px solid rgba(255,255,255,.05);
  }
  .sidebar-search-inner{
    display:flex;
    align-items:center;
    gap:.5rem;
    background:rgba(0,0,0,.25);
    padding:4px 10px;
    border-radius:999px;
  }
  .sidebar-search-inner i{
    font-size:1.1rem;
    opacity:.75;
  }
  .sidebar-search input{
    border:none;
    outline:none;
    background:transparent;
    color:var(--text);
    font-size:.85rem;
    width:100%;
  }
  .sidebar-search input::placeholder{
    color:rgba(255,255,255,.55);
  }

  .sidebar-nav{
    flex:1;
    overflow:auto;
  }
  .sidebar-nav ul{list-style:none; margin:0; padding:0}
  .sidebar-nav li{ border-bottom:1px solid rgba(255,255,255,.04); }

  /* Link clicável */
  .nav-link{
    display:flex; align-items:center; gap:.6rem;
    color:rgba(255,255,255,.92);
    padding:16px;
    font-size:.98rem; line-height:1;
    text-decoration:none;
    transition:background .2s ease;
  }
  .nav-link i{ font-size:1.35rem; width:1.35rem }
  .nav-link:hover{ background:rgba(255,255,255,.06) }

  /* Rótulos sem ação (Eventos, Gráficos) */
  .nav-label{
    display:flex; align-items:center; gap:.6rem;
    color:rgba(255,255,255,.92);
    padding:16px;
    font-size:.98rem; line-height:1;
    cursor:default; user-select:none;
  }
  .nav-label i{ font-size:1.35rem; width:1.35rem }

  /* Conteúdo */
  .content{
    margin-left:17em;
    min-height:100vh;
    padding:24px;
    display:flex;
    align-items:center;
    justify-content:center;
  }

  /* Hero: imagem grande e centralizada */
  .hero{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .hero img{
    width:min(95%, 1400px);
    max-height:85vh;
    height:auto; display:block;
  }

  /* Scroll fino na barra lateral (opcional) */
  .sidebar-nav{scrollbar-width:thin; scrollbar-color:#465462 transparent}
  .sidebar-nav::-webkit-scrollbar{width:8px}
  .sidebar-nav::-webkit-scrollbar-thumb{background:#465462;border-radius:8px}
  .sidebar-nav::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<section class="app">
  <aside class="sidebar">
    <header>Menu</header>

    <!-- Barra de pesquisa -->
    <div class="sidebar-search">
      <div class="sidebar-search-inner">
        <i class="ion-search"></i>
        <input id="nav-search" type="text" placeholder="Pesquisar fluxos..." />
      </div>
    </div>

    <nav class="sidebar-nav">
      <ul>
        <li>
          <a class="nav-link" href="https://germaninho.github.io/fluxo-pendencias-cscx-sankhya-abc-paulista/">
            <i class="ion-bag"></i> Fluxo Pendencias
          </a>
        </li>
        <li>
          <a class="nav-link" href="https://germaninho.github.io/fluxo-nps-blitz-cscx-sankhya-abc-paulista/">
            <i class="ion-ios-pulse-strong"></i> NPS Blitz
          </a>
        </li>
        <li>
          <span class="nav-label"><i class="ion-ios-settings"></i> Fluxo Eventos</span>
        </li>
        <li>
          <span class="nav-label"><i class="ion-ios-analytics-outline"></i> Gráficos</span>
        </li>
      </ul>
    </nav>
  </aside>

  <main class="content">
    <div class="hero">
      <!-- Imagem na raiz do repositório -->
      <img src="imagem-sankhya-adquiridas.png" alt="Sankhya e adquiridas">
    </div>
  </main>
</section>

<script>
  (function(){
    var searchInput = document.getElementById('nav-search');
    if (!searchInput) return;

    var items = document.querySelectorAll('.sidebar-nav li');

    searchInput.addEventListener('input', function(){
      var q = this.value.trim().toLowerCase();

      Array.prototype.forEach.call(items, function(li){
        var text = li.textContent.toLowerCase();
        li.style.display = (!q || text.indexOf(q) !== -1) ? '' : 'none';
      });
    });
  })();
</script>

</body>
</html>
